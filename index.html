<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高級灰白私人數位網銀</title>
  <style>
    :root {
      --bg-mist: #f4f5f7;
      --surface-white: #ffffff;
      --surface-soft: #f9fafb;
      --slate-900: #1f2329;
      --slate-700: #4e5969;
      --slate-500: #86909c;
      --slate-300: #c9cdd4;
      --border-light: #e5e6eb;
      --shadow-card: 0 4px 20px rgba(31, 35, 41, 0.04);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-mist);
      color: var(--slate-900);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* 頂部純白微霧導覽列 */
    .top-bar {
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .top-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--slate-900);
      letter-spacing: 0.8px;
    }
    .user-pill {
      font-size: 12px;
      background: var(--bg-mist);
      color: var(--slate-700);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid var(--border-light);
    }

    .app-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 18px 16px 60px 16px;
    }

    /* 登入畫面 */
    #loginView {
      background: var(--surface-white);
      border-radius: 22px;
      padding: 40px 26px;
      margin-top: 44px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }
    #loginView h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: var(--slate-900);
      text-align: center;
      letter-spacing: 0.5px;
    }
    #loginView p {
      margin: 0 0 28px 0;
      font-size: 13px;
      color: var(--slate-500);
      text-align: center;
    }
    .field-label {
      display: block;
      font-size: 12px;
      color: var(--slate-700);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .text-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: var(--surface-soft);
      color: var(--slate-900);
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .text-input:focus {
      border-color: var(--slate-700);
      background: var(--surface-white);
    }
    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--slate-900);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-primary:active { opacity: 0.88; }

    /* 網銀主畫面 */
    #mainView { display: none; }

    /* 頂部公告提示橫幅 */
    .alert-banner {
      background: var(--surface-white);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }
    .alert-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-mist);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .alert-content { flex: 1; }
    .alert-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 2px;
    }
    .alert-sub {
      font-size: 12px;
      color: var(--slate-500);
    }

    /* 常用功能區塊 */
    .section-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--slate-900);
      margin: 0 0 10px 2px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .quick-btn {
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 12px 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-700);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .quick-btn.active {
      background: var(--slate-900);
      color: #ffffff;
      border-color: var(--slate-900);
    }

    /* 分類頁籤列 */
    .tab-bar {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .tab-item {
      padding: 8px 2px 10px 2px;
      font-size: 14px;
      font-weight: 600;
      color: var(--slate-500);
      cursor: pointer;
      position: relative;
    }
    .tab-item.active {
      color: var(--slate-900);
    }
    .tab-item.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--slate-900);
      border-radius: 3px;
    }

    /* 概況大卡片 (高級灰白漸層質感) */
    .overview-card {
      background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
      margin-bottom: 18px;
    }

      gap: 6px;
      font-size: 15px;
