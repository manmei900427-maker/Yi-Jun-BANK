<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yi Jun bank</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; color: #1f2329; margin: 0; padding: 0; }
    .top-bar { background: #ffffff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e6eb; position: sticky; top: 0; z-index: 20; }
    .top-title { font-size: 16px; font-weight: 700; }
    .user-pill { font-size: 12px; background: #f4f5f7; color: #4e5969; padding: 4px 12px; border-radius: 20px; font-weight: 600; border: 1px solid #e5e6eb; }
    .container { max-width: 440px; margin: 0 auto; padding: 20px 16px 60px; }
    .card { background: #ffffff; border-radius: 20px; padding: 22px; box-shadow: 0 4px 20px rgba(31,35,41,0.04); border: 1px solid #e5e6eb; margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #4e5969; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 11px 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #e5e6eb; background: #f9fafb; font-size: 14px; outline: none; color: #1f2329; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #1f2329; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:disabled { background: #e5e6eb; color: #86909c; cursor: not-allowed; }
    .btn-outline { width: 100%; padding: 10px; border: 1px solid #4e5969; border-radius: 8px; background: #ffffff; color: #1f2329; font-size: 13px; font-weight: 600; cursor: pointer; }
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 20px; }
    .quick-btn { background: #ffffff; border: 1px solid #e5e6eb; border-radius: 12px; padding: 12px 2px; font-size: 11px; font-weight: 600; color: #4e5969; cursor: pointer; text-align: center; }
    .quick-btn.active { background: #1f2329; color: #ffffff; border-color: #1f2329; }
    .tabs { display: flex; gap: 14px; border-bottom: 1px solid #e5e6eb; margin-bottom: 16px; overflow-x: auto; }
    .tab { padding: 8px 2px 10px; font-size: 14px; font-weight: 600; color: #86909c; cursor: pointer; white-space: nowrap; }
    .tab.active { color: #1f2329; border-bottom: 3px solid #1f2329; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid #f4f5f7; font-size: 14px; }
    .tx-row:last-child { border-bottom: none; }
    .admin-sub { background: #f9fafb; border: 1px solid #e5e6eb; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .reward-edit-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; background: #ffffff; padding: 8px; border-radius: 8px; border: 1px solid #e5e6eb; }
    .reward-edit-row input { margin-bottom: 0; padding: 8px; font-size: 13px; }
    .btn-del-sm { background: #ffece8; color: #cb2634; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .wheel-wrap { position: relative; width: 200px; height: 200px; margin: 16px auto 20px; }
    .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 20px solid #1f2329; z-index: 10; }
    .wheel-circle {
      width: 100%; height: 100%; border-radius: 50%; border: 6px solid #1f2329;
      background: conic-gradient(#fff 0deg 36deg, #e5e6eb 36deg 72deg, #fff 72deg 108deg, #e5e6eb 108deg 144deg, #fff 144deg 180deg, #e5e6eb 180deg 216deg, #fff 216deg 252deg, #e5e6eb 252deg 288deg, #fff 288deg 324deg, #e5e6eb 324deg 360deg);
      display: flex; align-items: center; justify-content: center;
      transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }
    .wheel-center { width: 62px; height: 62px; border-radius: 50%; background: #1f2329; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; }
    .log-item { border: 1px solid #e5e6eb; background: #f9fafb; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .log-item:last-child { margin-bottom: 0; }
    .log-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #e5e6eb; }
    .log-date { font-weight: 700; font-size: 14px; color: #1f2329; }
    .log-bal { font-weight: 700; font-size: 13px; color: #1f2329; background: #ffffff; padding: 3px 10px; border-radius: 20px; border: 1px solid #e5e6eb; }
    .log-tx { font-size: 12px; color: #4e5969; padding: 4px 0; display: flex; justify-content: space-between; gap: 8px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title" id="uiTitle">Yi Jun bank</div>
    <div class="user-pill" id="uiRole">未登入</div>
  </div>

  <div class="container">
    <!-- 登入畫面 -->
    <div id="viewLogin" class="card" style="margin-top:34px; padding:36px 24px;">
      <h2 style="text-align:center; margin:0 0 6px; font-size:20px;">數位網銀安全登入</h2>
      <p style="text-align:center; color:#86909c; font-size:13px; margin:0 0 26px;">請輸入專屬帳號與密碼</p>
      <label>使用者帳號</label>
      <input type="text" id="inUser" placeholder="請輸入帳號">
      <label>登入密碼</label>
      <input type="password" id="inPwd" placeholder="請輸入密碼">
      <button type="button" class="btn" id="loginBtn">登入網銀</button>
    </div>

    <!-- 主畫面 -->
    <div id="viewMain" style="display:none;">
      <div class="card" style="padding:13px 16px; display:flex; align-items:center; gap:12px;">
        <div style="width:36px; height:36px; border-radius:10px; background:#f4f5f7; display:flex; align-items:center; justify-content:center; font-size:1
