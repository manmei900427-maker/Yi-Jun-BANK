<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yi Jun bank</title>
  <style>
    :root {
      --bg-mist: #f4f5f7;
      --surface-white: #ffffff;
      --surface-soft: #f9fafb;
      --slate-900: #1f2329;
      --slate-700: #4e5969;
      --slate-500: #86909c;
      --slate-300: #c9cdd4;
      --border-light: #e5e6eb;
      --shadow-card: 0 4px 20px rgba(31, 35, 41, 0.04);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-mist);
      color: var(--slate-900);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .top-bar {
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .top-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--slate-900);
      letter-spacing: 0.8px;
    }
    .user-pill {
      font-size: 12px;
      background: var(--bg-mist);
      color: var(--slate-700);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid var(--border-light);
    }

    .app-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 18px 16px 60px 16px;
    }

    #loginView {
      background: var(--surface-white);
      border-radius: 22px;
      padding: 40px 26px;
      margin-top: 44px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }
    #loginView h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: var(--slate-900);
      text-align: center;
      letter-spacing: 0.5px;
    }
    #loginView p {
      margin: 0 0 28px 0;
      font-size: 13px;
      color: var(--slate-500);
      text-align: center;
    }
    .field-label {
      display: block;
      font-size: 12px;
      color: var(--slate-700);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .text-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: var(--surface-soft);
      color: var(--slate-900);
      font-size: 14px;
      outline: none;
    }
    .text-input:focus {
      border-color: var(--slate-700);
      background: var(--surface-white);
    }
    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--slate-900);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn-primary:active { opacity: 0.88; }

    #mainView { display: none; }

    .alert-banner {
      background: var(--surface-white);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }
    .alert-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-mist);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .alert-content { flex: 1; }
    .alert-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 2px;
    }
    .alert-sub {
      font-size: 12px;
      color: var(--slate-500);
    }

    .section-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--slate-900);
      margin: 0 0 10px 2px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .quick-btn {
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 12px 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-700);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      text-align: center;
    }
    .quick-btn.active {
      background: var(--slate-900);
      color: #ffffff;
      border-color: var(--slate-900);
    }

    .tab-bar {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .tab-item {
      padding: 8px 2px 10px 2px;
      font-size: 14px;
      font-weight: 600;
      color: var(--slate-500);
      cursor: pointer;
      position: relative;
    }
    .tab-item.active {
      color: var(--slate-900);
    }
    .tab-item.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--slate-900);
      border-radius: 3px;
    }

    .overview-card {
      background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
      margin-bottom: 18px;
    }
    .ov-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 18px;
    }
    .ov-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .donut-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 9px solid #e5e6eb;
      border-top-color: #4e5969;
      border-right-color: #86909c;
    }
    .ov-total-box { text-align: right; }
    .ov-unit-label {
      font-size: 12px;
      color: var(--slate-500);
      margin-bottom: 4px;
    }
    .ov-total-num {
      font-size: 34px;
      font-weight: 700;
      color: var(--slate-900);
      letter-spacing: -0.5px;
    }

    .sub-list {
      border-top: 1px solid var(--border-light);
      padding-top: 12px;
    }
    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      font-size: 14px;
    }
    .sub-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--slate-700);
    }
    .pill-bar {
      width: 4px;
      height: 14px;
      border-radius: 2px;
    }
    .bar-1 { background: #1f2329; }
    .bar-2 { background: #86909c; }
    .bar-3 { background: #c9cdd4; }
    .sub-val {
      font-weight: 600;
      color: var(--slate-900);
    }
    .ov-footer-btn {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-700);
      cursor: pointer;
    }

    .redeem-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .reward-card {
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 16px 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .reward-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 6px;
    }
    .reward-cost {
      font-size: 13px;
      color: var(--slate-500);
      margin-bottom: 14px;
    }
    .btn-redeem {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: var(--slate-900);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-redeem:disabled {
      background: #e5e6eb;
      color: #86909c;
      cursor: not-allowed;
    }

    .tx-card {
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 6px 16px;
      box-shadow: var(--shadow-card);
    }
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--bg-mist);
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-title { font-size: 14px; font-weight: 600; color: var(--slate-900); }
    .tx-date { font-size: 11px; color: var(--slate-500); margin-top: 3px; }
    .tx-amt { font-size: 14px; font-weight: 700; }
    .amt-in { color: #009a29; }
    .amt-out { color: #cb2634; }

    .admin-section {
      display: none;
      background: var(--surface-white);
      border: 1.5px solid var(--slate-300);
      border-radius: 20px;
      padding: 20px;
      margin-top: 26px;
      box-shadow: var(--shadow-card);
    }
    .admin-section h3 {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: var(--slate-900);
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 10px;
    }
    .admin-box {
      background: var(--surface-soft);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

      font-size: 13px;

      color: var(--
