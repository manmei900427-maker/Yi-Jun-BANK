<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高級灰專屬數位網銀</title>
  <style>
    :root {
      --bg-page: #f2f3f5;
      --surface: #ffffff;
      --gray-dark: #2c2e33;
      --gray-medium: #5a5e66;
      --gray-light: #909399;
      --accent-slate: #4a5568;
      --border-line: #e4e7ed;
      --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--gray-dark);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* 頂部高級灰導覽列 */
    .top-bar {
      background-color: var(--surface);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-line);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .top-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-dark);
      letter-spacing: 0.5px;
    }
    .user-pill {
      font-size: 12px;
      background: #ebeef5;
      color: var(--gray-medium);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    .app-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 16px 60px 16px;
    }

    /* 登入畫面 */
    #loginView {
      background: var(--surface);
      border-radius: 20px;
      padding: 36px 24px;
      margin-top: 40px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-line);
    }
    #loginView h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: var(--gray-dark);
      text-align: center;
    }
    #loginView p {
      margin: 0 0 26px 0;
      font-size: 13px;
      color: var(--gray-light);
      text-align: center;
    }
    .field-label {
      display: block;
      font-size: 12px;
      color: var(--gray-medium);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .text-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      background: #f8f9fa;
      color: var(--gray-dark);
      font-size: 14px;
      outline: none;
    }
    .text-input:focus {
      border-color: var(--accent-slate);
      background: #ffffff;
    }
    .btn-dark {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--gray-dark);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-dark:active { opacity: 0.9; }

    /* 網銀主畫面 */
    #mainView { display: none; }

    /* 頂部安全/公告提示橫幅 (仿玉山安全提示欄) */
    .alert-banner {
      background: var(--surface);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-line);
    }
    .alert-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #eef0f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .alert-content { flex: 1; }
    .alert-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-dark);
      margin-bottom: 2px;
    }
    .alert-sub {
      font-size: 12px;
      color: var(--gray-light);
    }

    /* 常用功能區塊 (4格白底圓角卡片) */
    .section-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-dark);
      margin: 0 0 10px 2px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .quick-btn {
      background: var(--surface);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 12px 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-dark);
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      text-align: center;
    }
    .quick-btn.active {
      background: var(--gray-dark);
      color: #ffffff;
      border-color: var(--gray-dark);
    }

    /* 分類頁籤列 (總覽 / 點數兌換 / 往來明細) */
    .tab-bar {
      display: flex;
      gap: 18px;
      border-bottom: 1px solid var(--border-line);
      margin-bottom: 16px;
      padding: 0 4px;
      overflow-x: auto;
    }
    .tab-item {
      padding: 8px 2px 10px 2px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-light);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }
    .tab-item.active {
      color: var(--gray-dark);
    }
    .tab-item.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gray-dark);
      border-radius: 3px;
    }

    /* 存款/點數概況大卡片 (仿玉山總覽卡片) */
    .overview-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-line);
      margin-bottom: 18px;
    }
    .ov-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-dark);
      margin-bottom: 16px;
    }
    .ov-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    /* 高級灰質感圓環 */
    .donut-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 9px solid #dcdfe6;
      border-top-color: #4a5568;
      border-right-color: #718096;
    }
    .ov-total-box { text-align: right; }
    .ov-unit-label {
      font-size: 12px;
      color: var(--gray-light);
      margin-bottom: 4px;
    }
    .ov-total-num {
      font-size: 32px;
      font-weight: 700;
      color: var(--gray-dark);
      letter-spacing: -0.5px;
    }

    /* 細項清單 (仿臺幣綜存/定存列表) */
    .sub-list {
      border-top: 1px solid #f0f2f5;
      padding-top: 12px;
    }
    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      font-size: 14px;
    }
    .sub-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gray-medium);
    }
    .pill-bar {
      width: 4px;
      height: 14px;
      border-radius: 2px;
    }
    .bar-1 { background: #2c2e33; }
    .bar-2 { background: #718096; }
    .bar-3 { background: #a0aec0; }
    .sub-val {
      font-weight: 600;
      color: var(--gray-dark);
    }
    .ov-footer-btn {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-line);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-slate);
      cursor: pointer;
    }

    /* 點數兌換商城區塊 */
    .redeem-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .reward-card {
      background: var(--surface);
      border: 1px solid var(--border-line);
      border-radius: 14px;
      padding: 16px 14px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .reward-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-dark);
      margin-bottom: 6px;
    }
    .reward-cost {
      font-size: 13px;
      color: var(--gray-medium);
      margin-bottom: 14px;
    }
    .btn-redeem {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: var(--gray-dark);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-redeem:disabled {
      background: #dcdfe6;
      color: #909399;
      cursor: not-allowed;
    }

    /* 往來明細列表 */
    .tx-card {
      background: var(--surface);
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: 6px 16px;
      box-shadow: var(--shadow-soft);
    }
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #f0f2f5;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-title { font-size: 14px; font-weight: 600; color: var(--gray-dark); }
    .tx-date { font-size: 11px; color: var(--gray-light); margin-top: 3px; }
    .tx-amt { font-size: 14px; font-weight: 700; }
    .amt-in { color: #2b8a3e; }
    .amt-out { color: #c92a2a; }

    /* 管理員專屬後台 (僅 manmei 可見) */
    .admin-section {
      display: none;
      background: var(--surface);
      border: 1.5px solid var(--gray-dark);
      border-radius: 18px;
      padding: 20px;
      margin-top: 24px;
      box-shadow: var(--shadow-soft);
    }
    .admin-section h3 {
      margin: 0 0 14px 0;
      font-size: 15px;
      color: var(--gray-dark);
      border-bottom: 1px solid var(--border-line);
      padding-bottom: 10px;
    }
    .admin-box {
      background: #f8f9fa;
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .admin-box-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-dark);
      margin-bottom: 10px;
    }
    .btn-outline {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--gray-dark);
      border-radius: 8px;
      background: #ffffff;
      color: var(--gray-dark);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .mini-del-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
    }

    .logout-area {
      text-align: center;
      margin-top: 26px;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid #cfd3dc;
      color: var(--gray-medium);
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title" id="uiTopTitle">數位私人網銀</div>
    <div class="user-pill" id="uiUserBadge">未登入</div>
  </div>

  <div class="app-container">

    <!-- 登入畫面 -->
    <div id="loginView">
      <h2>數位網銀安全登入</h2>
      <p>請輸入專屬帳號與密碼</p>
      
      <label class="field-label">使用者帳號</label>
      <input type="text" id="loginUser" class="text-input" placeholder="請輸入帳號">
      
      <label class="field-label">登入密碼</label>
      <input type="password" id="loginPwd" class="text-input" placeholder="請輸入密碼">
      
      <button type="button" class="btn-dark" onclick="handleLogin()">登入網銀</button>
    </div>

    <!-- 網銀主畫面 -->
    <div id="mainView">

      <!-- 頂部公告提示欄 (仿玉山橫幅) -->
      <div class="alert-banner">
        <div class="alert-icon">🔔</div>
        <div class="alert-content">
          <div class="alert-title" id="uiBannerTitle">請勿隨意將點數轉讓他人</div>
          <div class="alert-sub" id="uiBannerSub">小心甜蜜詐騙以確保帳戶安全</div>
        </div>
      </div>

      <div class="section-heading">常用功能</div>
      <div class="quick-grid">
        <button type="button" class="quick-btn active" id="qBtnOverview" onclick="switchTab('overview')">點數總覽</button>
        <button type="button" class="quick-btn" id="qBtnRedeem" onclick="switchTab('redeem')">兌換獎勵</button>
