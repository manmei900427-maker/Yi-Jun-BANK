<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yi Jun bank</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; color: #1f2329; margin: 0; padding: 0; }
    .top-bar { background: #ffffff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e6eb; position: sticky; top: 0; z-index: 20; }
    .top-title { font-size: 16px; font-weight: 700; }
    .user-pill { font-size: 12px; background: #f4f5f7; color: #4e5969; padding: 4px 12px; border-radius: 20px; font-weight: 600; border: 1px solid #e5e6eb; }
    .container { max-width: 440px; margin: 0 auto; padding: 20px 16px 60px; }
    .card { background: #ffffff; border-radius: 20px; padding: 22px; box-shadow: 0 4px 20px rgba(31,35,41,0.04); border: 1px solid #e5e6eb; margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #4e5969; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 11px 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #e5e6eb; background: #f9fafb; font-size: 14px; outline: none; color: #1f2329; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #1f2329; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:disabled { background: #e5e6eb; color: #86909c; cursor: not-allowed; }
    .btn-outline { width: 100%; padding: 10px; border: 1px solid #4e5969; border-radius: 8px; background: #ffffff; color: #1f2329; font-size: 13px; font-weight: 600; cursor: pointer; }
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 20px; }
    .quick-btn { background: #ffffff; border: 1px solid #e5e6eb; border-radius: 12px; padding: 12px 2px; font-size: 11px; font-weight: 600; color: #4e5969; cursor: pointer; text-align: center; }
    .quick-btn.active { background: #1f2329; color: #ffffff; border-color: #1f2329; }
    .tabs { display: flex; gap: 14px; border-bottom: 1px solid #e5e6eb; margin-bottom: 16px; overflow-x: auto; }
    .tab { padding: 8px 2px 10px; font-size: 14px; font-weight: 600; color: #86909c; cursor: pointer; white-space: nowrap; }
    .tab.active { color: #1f2329; border-bottom: 3px solid #1f2329; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid #f4f5f7; font-size: 14px; }
    .tx-row:last-child { border-bottom: none; }
    .admin-sub { background: #f9fafb; border: 1px solid #e5e6eb; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .reward-edit-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; background: #ffffff; padding: 8px; border-radius: 8px; border: 1px solid #e5e6eb; }
    .reward-edit-row input { margin-bottom: 0; padding: 8px; font-size: 13px; }
    .btn-del-sm { background: #ffece8; color: #cb2634; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .wheel-wrap { position: relative; width: 200px; height: 200px; margin: 16px auto 20px; }
    .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 20px solid #1f2329; z-index: 10; }
    .wheel-circle {
      width: 100%; height: 100%; border-radius: 50%; border: 6px solid #1f2329;
      background: conic-gradient(#fff 0deg 36deg, #e5e6eb 36deg 72deg, #fff 72deg 108deg, #e5e6eb 108deg 144deg, #fff 144deg 180deg, #e5e6eb 180deg 216deg, #fff 216deg 252deg, #e5e6eb 252deg 288deg, #fff 288deg 324deg, #e5e6eb 324deg 360deg);
      display: flex; align-items: center; justify-content: center;
      transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }
    .wheel-center { width: 62px; height: 62px; border-radius: 50%; background: #1f2329; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title" id="uiTitle">Yi Jun bank</div>
    <div class="user-pill" id="uiRole">未登入</div>
  </div>

  <div class="container">
    <div id="viewLogin" class="card" style="margin-top:34px; padding:36px 24px;">
      <h2 style="text-align:center; margin:0 0 6px; font-size:20px;">數位網銀安全登入</h2>
      <p style="text-align:center; color:#86909c; font-size:13px; margin:0 0 26px;">請輸入專屬帳號與密碼</p>
      <label>使用者帳號</label>
      <input type="text" id="inUser" placeholder="請輸入帳號">
      <label>登入密碼</label>
      <input type="password" id="inPwd" placeholder="請輸入密碼">
      <button type="button" class="btn" id="loginBtn">登入網銀</button>
    </div>

    <div id="viewMain" style="display:none;">
      <div class="card" style="padding:13px 16px; display:flex; align-items:center; gap:12px;">
        <div style="width:36px; height:36px; border-radius:10px; background:#f4f5f7; display:flex; align-items:center; justify-content:center; font-size:17px;">🔔</div>
        <div>
          <div style="font-weight:700; font-size:13px;" id="uiNoticeTitle">請勿依他人指示操作轉帳</div>
          <div style="font-size:12px; color:#86909c;" id="uiNoticeSub">小心甜蜜詐騙以確保帳戶資金安全</div>
        </div>
      </div>

      <div style="font-size:14px; font-weight:700; margin:0 0 10px 2px;">常用功能</div>
      <div class="quick-grid">
        <button type="button" class="quick-btn active" id="q1">存款總覽</button>
        <button type="button" class="quick-btn" id="q2">兌換獎勵</button>
        <button type="button" class="quick-btn" id="q4">每日抽獎</button>
        <button type="button" class="quick-btn" id="qSupport">專屬客服</button>
      </div>

      <div class="tabs">
        <div class="tab active" id="t1">總覽</div>
        <div class="tab" id="t2">兌換獎勵</div>
        <div class="tab" id="t4">每日抽獎</div>
        <div class="tab" id="t3">往來明細</div>
      </div>

      <div id="p1" class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
          <div style="font-weight:700; font-size:15px;">存款概況</div>
          <div style="font-size:12px; font-weight:600; color:#e0245e; background:#fff0f3; padding:4px 10px; border-radius:20px; border:1px solid #ffd6e0;">2023.09.05 ❤️</div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;">
          <div style="width:68px; height:68px; border-radius:50%; border:9px solid #e5e6eb; border-top-color:#4e5969; border-right-color:#86909c;"></div>
          <div style="text-align:right;">
            <div style="font-size:12px; color:#86909c; margin-bottom:4px;">等值新台幣 TWD</div>
            <div style="font-size:34px; font-weight:700;" id="uiBal">0</div>
          </div>
        </div>
        <div style="border-top:1px solid #e5e6eb; padding-top:12px; font-size:14px; display:flex; justify-content:space-between;">
          <span style="color:#4e5969;">臺幣綜存、活存</span>
          <span style="font-weight:600;" id="uiSub1">0</span>
        </div>
      </div>

      <div id="p2" style="display:none;">
        <div style="font-size:14px; font-weight:700; margin:0 0 10px 2px;">專屬獎勵兌換 (新台幣計價)</div>
        <div class="grid-2" id="uiRewards"></div>
      </div>

      <div id="p3" style="display:none;">
        <div style="font-size:14px; font-weight:700; margin:0 0 10px 2px;">近期往來明細 (TWD)</div>
        <div class="card" style="padding:6px 16px;"><div id="uiHistory"></div></div>
      </div>

      <div id="p4" class="card" style="display:none; text-align:center;">
        <div style="font-weight:700; font-size:16px; margin-bottom:4px;">每日幸運大抽獎</div>
        <div style="font-size:12px; color:#86909c;">每日可免費抽獎一次，隨機獲得新台幣 10 ~ 100 元</div>
        <div class="wheel-wrap">
          <div class="wheel-pointer"></div>
          <div class="wheel-circle" id="wheelCircle"><div class="wheel-center">TWD<br>10~100元</div></div>
        </div>
        <div id="spinStatusText" style="font-size:13px; font-weight:600; color:#4e5969; margin-bottom:14px;">今日尚未抽獎</div>
        <button type="button" class="btn" id="btnSpin">立即抽獎拿紅包</button>
      </div>

      <div id="adminBox" class="card" style="display:none; border:1.5px solid #c9cdd4; margin-top:26px;">
        <h3 style="margin:0 0 14px; font-size:15px;">⚙️ 管理員控制中心</h3>
        
        <div class="admin-sub">
          <div style="font-weight:700; font-size:13px; margin-bottom:8px;">1. 新增入帳 / 扣款明細 (TWD)</div>
          <input type="text" id="aDesc" placeholder="項目說明">
          <input type="number" id="aAmt" placeholder="金額 (存入正數，扣款負數)">
          <button type="button" class="btn-outline" id="addTxBtn">確認新增明細並更新餘額</button>
        </div>

        <div class="admin-sub">
          <div style="font-weight:700; font-size:13px; margin-bottom:8px;">2. 獎勵兌換管理 (隨時修改金額或新增)</div>
          <div style="display:flex; gap:6px; margin-bottom:12px;">
            <input type="text" id="aRName" placeholder="獎勵名稱" style="margin-bottom:0;">
            <input type="number" id="aRCost" placeholder="金額" style="width:100px; margin-bottom:0;">
            <button type="button" id="addRewardBtn" style="background:#1f2329; color:#fff; border:none; border-radius:8px; padding:0 14px; font-size:13px; font-weight:600; cursor:pointer;">新增</button>
          </div>
          <div id="adminRewardEditor"></div>
          <button type="button" class="btn-outline" style="margin-top:6px;" id="saveRewardsBtn">儲存獎勵列表修改</button>
        </div>

        <div class="admin-sub" style="margin-bottom:0;">
          <div style="font-weight:700; font-size:13px; margin-bottom:8px;">3. 修改文字、客服電話與總餘額</div>
          <label>頂部網銀名稱</label><input type="text" id="aTitle">
          <label>專屬客服電話</label><input type="text" id="aPhone">
          <label>公告主標題</label><input type="text" id="aNotice1">
          <label>公告副標題</label><input type="text" id="aNotice2">
          <label>總餘額 (新台幣 TWD)</label><input type="number" id="aNewBal">
          <button type="button" class="btn" style="margin-bottom:10px;" id="saveSettingsBtn">儲存文字與餘額修改</button>
          <button type="button" class="btn-outline" id="resetSpinBtn">重置今日抽獎次數 (供測試)</button>
        </div>
      </div>

      <div style="text-align:center; margin-top:26px;">
        <button type="button" id="logoutBtn" style="background:#fff; border:1px solid #e5e6eb; color:#4e5969; padding:8px 24px; border-radius:20px; font-size:12px; cursor:pointer;">登出網銀系統</button>
      </div>
    </div>
  </div>

  <script>
    var curUser = "";
    var isSpinning = false;
    var wheelDeg = 0;
    var dbData = {
      title: "Yi Jun bank",
      phone: "0903122912",
      notice1: "請勿依他人指示操作轉帳",
      notice2: "小心甜蜜詐騙以確保帳戶資金安全",
      bal: 13140,
      lastSpinDate: "",
      rewards: [
        { name: "指定大餐一頓$1000", cost: 1500 },
        { name: "無條件券限兌換一次", cost: 3000 },
        { name: "生日禮物兌換券一年一次", cost: 15000 },
        { name: "挖耳屎券", cost: 200 },
        { name: "遊戲儲值券$500", cost: 1000 },
        { name: "早餐券", cost: 200 },
        { name: "免費晚餐券", cost: 1500 },
        { name: "外送券", cost: 500 }
      ],
      history: [{ desc: "開戶尊榮禮金", amt: 13140, date: "2026-11-18" }]
    };

    try {
      var local = localStorage.getItem("yijun_bank_final_v8");
      if (local) dbData = JSON.parse(local);
    } catch (e) {}

    function persist() {
      try { localStorage.setItem("yijun_bank_final_v8", JSON.stringify(dbData)); } catch (e) {}
    }

    function getToday() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
    }

    function showSupport() {
      alert("【Yi Jun bank 專屬客服】\n\n客服專線：" + (dbData.phone || "0903122912") + "\n服務時間：24 小時全年無休");
    }

    function goTab(n) {
      document.getElementById("p1").style.display = (n === 1) ? "block" : "none";
      document.getElementById("p2").style.display = (n === 2) ? "block" : "none";
      document.getElementById("p3").style.display = (n === 3) ? "block" : "none";
      document.getElementById("p4").style.display = (n === 4) ? "block" : "none";
      document.getElementById("t1").className = (n === 1) ? "tab active" : "tab";
      document.getElementById("t2").className = (n === 2) ? "tab active" : "tab";
      document.getElementById("t3").className = (n === 3) ? "tab active" : "tab";
      document.getElementById("t4").className = (n === 4) ? "tab active" : "tab";
      document.getElementById("q1").className = (n === 1) ? "quick-btn active" : "quick-btn";
      document.getElementById("q2").className = (n === 2) ? "quick-btn active" : "quick-btn";
      document.getElementById("q4").className = (n === 4) ? "quick-btn active" : "quick-btn";
    }

    function render() {
      document.getElementById("uiTitle").innerText = dbData.title;
      document.getElementById("uiNoticeTitle").innerText = dbData.notice1;
      document.getElementById("uiNoticeSub").innerText = dbData.notice2;
      document.getElementById("uiBal").innerText = Number(dbData.bal).toLocaleString();
      document.getElementById("uiSub1").innerText = Number(dbData.bal).toLocaleString();

      var spun = (dbData.lastSpinDate === getToday());
      var bSpin = document.getElementById("btnSpin");
      if (bSpin) {
        bSpin.disabled = spun;
        bSpin.innerText = spun ? "今日已完成抽獎" : "立即抽獎拿紅包";
      }
      var sTxt = document.getElementById("spinStatusText");
      if (sTxt) {
        sTxt.innerText = spun ? "今天已經抽過獎囉，明天再來！" : "今日免費抽獎機會：1 次";
      }

      var rGrid = document.getElementById("uiRewards");
      rGrid.innerHTML = "";
      dbData.rewards.forEach(function(r, idx) {
        var ok = Number(dbData.bal) >= Number(r.cost);
        var card = document.createElement("div");
        card.className = "card";
        card.style.cssText = "padding:16px; margin-bottom:0; display:flex; flex-direction:column; justify-content:space-between;";
        card.innerHTML = '<div><div style="font-weight:700; font-size:14px; margin-bottom:6px;">' + r.name + '</div><div style="font-size:13px; color:#86909c; margin-bottom:14px;">NT$ ' + Number(r.cost).toLocaleString() + ' 元</div></div>';
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.style.cssText = "padding:9px; font-size:12px;";
        btn.disabled = !ok;
        btn.innerText = ok ? "立即兌換" : "餘額不足";
        btn.onclick = function() {
          if (!confirm("確定花費新台幣 " + r.cost + " 元兌換「" + r.name + "」？")) return;
          dbData.bal = Number(dbData.bal) - Number(r.cost);
          dbData.history.unshift({ desc: "兌換獎勵：" + r.name, amt: -Number(r.cost), date: getToday() });
          persist();
          render();
          alert("兌換成功！請截圖向管理員領取。");
        };
        card.appendChild(btn);
        rGrid.appendChild(card);
      });

      if (curUser === "manmei") {
        document.getElementById("aTitle").value = dbData.title;
        document.getElementById("aPhone").value = dbData.phone || "0903122912";
        document.getElementById("aNotice1").value = dbData.notice1;
        document.getElementById("aNotice2").value = dbData.notice2;
        document.getElementById("aNewBal").value = dbData.bal;

        var editor = document.getElementById("adminRewardEditor");
        editor.innerHTML = "";
        dbData.rewards.forEach(function(r, k) {
          var row = document.createElement("div");
          row.className = "reward-edit-row";
          row.innerHTML = '<input type="text" id="eName_' + k + '" value="' + r.name + '"><input type="number" id="eCost_' + k + '" value="' + r.cost + '" style="width:90px;">';
          var del = document.createElement("button");
          del.type = "button";
          del.className = "btn-del-sm";
          del.innerText = "刪";
          del.onclick = function() {
            dbData.rewards.splice(k, 1);
            persist();
            render();
          };
          row.appendChild(del);
          editor.appendChild(row);
        });
      }

      var hBox = document.getElementById("uiHistory");
      hBox.innerHTML = "";
      dbData.history.forEach(function(h, j) {
        var plus = Number(h.amt) >= 0;
        var row = document.createElement("div");
        row.className = "tx-row";
        row.innerHTML = '<div><div style="font-weight:600;">' + h.desc + '</div><div style="font-size:11px; color:#86909c;">' + h.date + '</div></div>';
        var right = document.createElement("div");
        right.innerHTML = '<span style="font-weight:700; color:' + (plus ? '#009a29' : '#cb2634') + ';">' + (plus ? '+' : '') + Number(h.amt).toLocaleString() + ' 元</span>';
        if (curUser === "manmei") {
          var dBtn = document.createElement("button");
          dBtn.type = "button";
          dBtn.style.cssText = "margin-left:8px; background:#ffece8; color:#cb2634; border:none; padding:4px 8px; border-radius:6px; font-size:11px; cursor:pointer;";
          dBtn.innerText = "刪";
          dBtn.onclick = function() {
            dbData.history.splice(j, 1);
            persist();
            render();
          };
          right.appendChild(dBtn);
        }
        row.appendChild(right);
        hBox.appendChild(row);
      });
    }

    window.addEventListener("DOMContentLoaded", function() {
      document.getElementById("loginBtn").onclick = function() {
        var u = document.getElementById("inUser").value.trim().toLowerCase();
        var p = document.getElementById("inPwd").value.trim();
        
        if (u === "manmei" && p === "0427") {
          curUser = "manmei";
          document.getElementById("uiRole").innerText = "管理員：MANMEI";
          document.getElementById("adminBox").style.display = "block";
        } else if (u === "yijun" && p === "0617") {
          curUser = "yijun";
          document.getElementById("uiRole").innerText = "使用者：YIJUN";
          document.getElementById("adminBox").style.display = "none";
        } else {
          alert("帳號或密碼錯誤！");
          return;
        }

        document.getElementById("viewLogin").style.display = "none";
        document.getElementById("viewMain").style.display = "block";
        goTab(1);
        render();
      };

      document.getElementById("logoutBtn").onclick = function() {
        curUser = "";
        document.getElementById("inUser").value = "";
        document.getElementById("inPwd").value = "";
        document.getElementById("viewMain").style.display = "none";
        document.getElementById("viewLogin").style.display = "block";
        document.getElementById("uiRole").innerText = "未登入";
      };

      document.getElementById("q1").onclick = function() { goTab(1); };
      document.getElementById("q2").onclick = function() { goTab(2); };
      document.getElementById("q4").onclick = function() { goTab(4); };
      document.getElementById("t1").onclick = function() { goTab(1); };
      document.getElementById("t2").onclick = function() { goTab(2); };
      document.getElementById("t3").onclick = function() { goTab(3); };
      document.getElementById("t4").onclick = function() { goTab(4); };
      document.getElementById("qSupport").onclick = showSupport;

      document.getElementById("btnSpin").onclick = function() {
        if (isSpinning || dbData.lastSpinDate === getToday()) return;
        isSpinning = true;
        var btn = document.getElementById("btnSpin");
        btn.disabled = true;
        btn.innerText = "轉盤旋轉中...";
        
        var prize = Math.floor(Math.random() * (100 - 10 + 1)) + 10;
        wheelDeg += 1800 + (prize * 3.6);
        document.getElementById("wheelCircle").style.transform = "rotate(" + wheelDeg + "deg)";
        
        setTimeout(function() {
          isSpinning = false;
          dbData.lastSpinDate = getToday();
          dbData.bal = Number(dbData.bal) + prize;
          dbData.history.unshift({ desc: "每日幸運大抽獎獎金", amt: prize, date: getToday() });
          persist();
          render();
          alert("🎉 恭喜抽中每日紅包：新台幣 " + prize + " 元！\n已自動存入您的帳戶餘額。");
        }, 3100);
      };

      document.getElementById("addTxBtn").onclick = function() {
        var desc = document.getElementById("aDesc").value.trim();
        var amt = Number(document.getElementById("aAmt").value);
        if (!desc || isNaN(amt) || amt === 0) return;
        dbData.bal = Number(dbData.bal) + amt;
        dbData.history.unshift({ desc: desc, amt: amt, date: getToday() });
        persist();
        render();
        alert("已新增明細並更新餘額！");
      };

      document.getElementById("addRewardBtn").onclick = function() {
        var name = document.getElementById("aRName").value.trim();
        var cost = Number(document.getElementById("aRCost").value);
        if (!name || isNaN(cost) || cost <= 0) return;
        dbData.rewards.push({ name: name, cost: cost });
        persist();
        render();
        alert("已上架新獎勵！");
      };

      document.getElementById("saveRewardsBtn").onclick = function() {
        var up = [];
        for (var k = 0; k < dbData.rewards.length; k++) {
          var n = document.getElementById("eName_" + k).value.trim();
          var c = Number(document.getElementById("eCost_" + k).value);
          if (n && !isNaN(c) && c > 0) up.push({ name: n, cost: c });
        }
        dbData.rewards = up;
        persist();
        render();
        alert("獎勵名稱與金額已儲存！");
      };

      document.getElementById("saveSettingsBtn").onclick = function() {
        dbData.title = document.getElementById("aTitle").value;
        dbData.phone = document.getElementById("aPhone").value;
        dbData.notice1 = document.getElementById("aNotice1").value;
        dbData.notice2 = document.getElementById("aNotice2").value;
        dbData.bal = Number(document.getElementById("aNewBal").value);
        persist();
        render();
        alert("修改已儲存！");
      };

      document.getElementById("resetSpinBtn").onclick = function() {
        dbData.lastSpinDate = "";
        persist();
        render();
        alert("已重置今日抽獎次數！");
      };
    });
  </script>
</body>
</html>
